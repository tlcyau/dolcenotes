services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dolcenotes
      POSTGRES_PASSWORD: dolcenotes
      POSTGRES_DB: dolcenotes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolcenotes -d dolcenotes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
